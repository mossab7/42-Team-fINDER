name: Bug report
description: Report a reproducible problem without exposing student or credential data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API credentials, session cookies, private keys, or identifiable student data. Redact screenshots and logs."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Commit hash, release, or deployment URL
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, and demo/live mode. Do not paste secrets.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, session data, and identifiable student information.
          required: true
