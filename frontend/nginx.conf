map $request_uri $robots_tag {
  default "";
  ~^/(discover|matches|explore)(?:/|$) "noindex, nofollow";
}

server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { try_files $uri $uri/ /index.html; }
  # Authenticated app pages contain private, fast-changing student data and
  # should not become search results. The map uses the original request URI,
  # so the header survives the SPA fallback to index.html.
  add_header X-Robots-Tag $robots_tag always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
